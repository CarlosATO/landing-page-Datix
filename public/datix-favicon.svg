<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0e3baa"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" ry="6" fill="url(#bg)"/>
  <!-- Stylized "D" letter with upward arrow motif -->
  <path d="M8 7h6c5.5 0 10 4.5 10 9s-4.5 9-10 9H8V7z" fill="none" stroke="url(#arrow)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Arrow pointing up-right (represents growth/success from the logo) -->
  <path d="M13 20L21 10" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <path d="M17 9.5H21.5V14" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Small decorative dots representing the wheat/data motif -->
  <circle cx="10" cy="12" r="1" fill="#93c5fd" opacity="0.8"/>
  <circle cx="10" cy="16" r="1" fill="#93c5fd" opacity="0.6"/>
  <circle cx="10" cy="20" r="1" fill="#93c5fd" opacity="0.4"/>
</svg>
